[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairpath"
version = "1.0.0"
description = "Fairness-aware early warning for student success: audit, mitigation, explanation and a decision-support dashboard."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MD SADRUL ANAM" }]
keywords = ["algorithmic fairness", "responsible AI", "educational data mining", "early warning", "fairlearn", "explainability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost-cpu>=2.1",
  "optuna>=3.6",
  "fairlearn>=0.11",
  "shap>=0.45",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "reportlab>=4.0"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "black>=24", "pre-commit>=3.7", "jupyter>=1.0", "nbconvert>=7"]
tracking = ["mlflow>=2.12"]

[project.scripts]
fairpath = "fairpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fairpath = ["py.typed"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "S310", "S603", "S607", "RUF001", "RUF002", "RUF003", "RUF005", "RUF059", "B008", "B007", "B023", "E501", "E731", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"notebooks/*" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: trains models; deselect with -m 'not slow'", "realdata: needs the real UCI CSVs"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/fairpath"]
omit = ["src/fairpath/pipeline/figures.py"]
